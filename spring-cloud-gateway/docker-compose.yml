version: '3.8'

services:

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"

  car-service:
    build: ./car-service
    container_name: car-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
      - car-service
spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka

okta.oauth2.issuer= #https://dev-133320.okta.com/oauth2/default
okta.oauth2.client-id= #0oa35aqn81ftCrz53357
okta.oauth2.client-secret= #YOUR_SECRET

feign.hystrix.enabled=true
hystrix.shareSecurityContext=true

zuul.routes.car-service.path=/cars
zuul.routes.car-service.url=http://car-service:8090

zuul.routes.home.path=/home
zuul.routes.home.url=http://car-service:8090

zuul.sensitive-headers=Cookie,Set-Cookie